services:
  api:
    environment:
      FEWIA_OPENAI_API_KEY_FILE: /run/secrets/openai_api_key
      FEWIA_OPENAI_REGION: ${FEWIA_OPENAI_REGION:-global}
  worker:
    environment:
      FEWIA_OPENAI_API_KEY_FILE: /run/secrets/openai_api_key
      FEWIA_OPENAI_REGION: ${FEWIA_OPENAI_REGION:-global}
    secrets:
      - source: openai_api_key
        target: openai_api_key

secrets:
  openai_api_key:
    environment: FEWIA_OPENAI_API_KEY
