name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  compose:
    name: Compose config
    runs-on: ubuntu-latest
    env:
      FEWIA_BEDROCK_CREDENTIALS_FILE: /tmp/fewia-ci/bedrock-credentials
      FEWIA_SPOONACULAR_KEY_FILE: /tmp/fewia-ci/spoonacular-key

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Create overlay secret files
        run: |
          mkdir -p /tmp/fewia-ci
          : > /tmp/fewia-ci/bedrock-credentials
          : > /tmp/fewia-ci/spoonacular-key

      - name: Validate compose files
        run: |
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.bedrock.yaml config --quiet
          docker compose -f compose.yaml -f compose.spoonacular.yaml config --quiet

  backend:
    name: Backend checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql+psycopg://fewia:fewia@localhost:5432/fewia_eval
      FEWIA_JOB_TEST_DATABASE_URL: postgresql+psycopg://fewia:fewia@localhost:5432/fewia_eval
      FEWIA_EVALUATION_DATABASE_URL: postgresql+psycopg://fewia:fewia@localhost:5432/fewia_eval
      FEWIA_REQUIRE_DB: "1"

    services:
      postgres:
        image: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
        env:
          POSTGRES_USER: fewia
          POSTGRES_PASSWORD: fewia
          POSTGRES_DB: fewia_eval
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fewia -d fewia_eval -p 5432"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install the dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check app tests alembic

      - name: Check the format
        run: uv run ruff format --check app tests alembic

      - name: Type check
        run: uv run mypy --strict app

      - name: Migrate the database
        run: uv run alembic upgrade head

      - name: Check for migration drift
        run: uv run alembic check

      - name: Test
        run: uv run pytest

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.23.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
