name: Tooling

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tools:
    name: Tooling checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install the dependencies
        run: uv sync --project backend --frozen

      - name: Lint
        run: uv run --project backend ruff check dev_supervisor tests infra --exclude infra/bedrock

      - name: Check the format
        run: uv run --project backend ruff format --check dev_supervisor tests infra --exclude infra/bedrock

      - name: Type check
        run: uv run --project backend mypy --strict dev_supervisor infra/bedrock_session.py infra/floci_bootstrap.py

      - name: Test
        run: uv run --project backend pytest -q -n auto tests/supervisor tests/infra
        env:
          PYTHONPATH: .

  bedrock-infra:
    name: Bedrock CDK checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infra/bedrock

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22.23.0"

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: infra/bedrock/uv.lock

      - name: Install the dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Check the format
        run: uv run ruff format --check .

      - name: Cache the mypy results
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: infra/bedrock/.mypy_cache
          key: mypy-bedrock-${{ runner.os }}-${{ hashFiles('infra/bedrock/uv.lock') }}-${{ github.sha }}
          restore-keys: |
            mypy-bedrock-${{ runner.os }}-${{ hashFiles('infra/bedrock/uv.lock') }}-

      - name: Type check
        run: uv run mypy --strict .

      - name: Test
        run: uv run pytest

  hosting-infra:
    name: Hosting CDK checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infra/hosting

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22.23.0"

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: infra/hosting/uv.lock

      - name: Install the dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Check the format
        run: uv run ruff format --check .

      - name: Cache the mypy results
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: infra/hosting/.mypy_cache
          key: mypy-hosting-${{ runner.os }}-${{ hashFiles('infra/hosting/uv.lock') }}-${{ github.sha }}
          restore-keys: |
            mypy-hosting-${{ runner.os }}-${{ hashFiles('infra/hosting/uv.lock') }}-

      - name: Type check
        run: uv run mypy --strict .

      - name: Test
        run: uv run pytest -q
