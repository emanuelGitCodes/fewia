name: Audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  python:
    name: Python dependency audit
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            backend/uv.lock
            infra/bedrock/uv.lock
            infra/hosting/uv.lock

      - name: Audit the backend dependencies
        run: |
          uv export --frozen --no-hashes --project backend > req.txt
          uvx pip-audit==2.10.1 -r req.txt --strict --no-deps --disable-pip

      - name: Audit the Bedrock infrastructure dependencies
        run: |
          uv export --frozen --no-hashes --project infra/bedrock > req.txt
          uvx pip-audit==2.10.1 -r req.txt --strict --no-deps --disable-pip

      - name: Audit the hosting infrastructure dependencies
        run: |
          uv export --frozen --no-hashes --project infra/hosting > req.txt
          uvx pip-audit==2.10.1 -r req.txt --strict --no-deps --disable-pip

  npm:
    name: npm dependency audit
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22.23.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the dependencies
        run: npm ci --ignore-scripts

      - name: Audit the dependencies
        run: npm audit --audit-level=high
