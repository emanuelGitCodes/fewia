name: Audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  python:
    name: Python dependency audit
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: |
            backend/uv.lock
            infra/bedrock/uv.lock

      - name: Audit the backend dependencies
        run: |
          uv export --frozen --no-hashes --project backend > req.txt
          uvx pip-audit -r req.txt --strict --no-deps --disable-pip

      - name: Audit the Bedrock infrastructure dependencies
        run: |
          uv export --frozen --no-hashes --project infra/bedrock > req.txt
          uvx pip-audit -r req.txt --strict --no-deps --disable-pip

  npm:
    name: npm dependency audit
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.23.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the dependencies
        run: npm ci --ignore-scripts

      - name: Audit the dependencies
        run: npm audit --audit-level=high
