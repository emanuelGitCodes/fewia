services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: fewia
      POSTGRES_PASSWORD: fewia
      POSTGRES_DB: fewia
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fewia -d fewia"]
      interval: 5s
      timeout: 5s
      retries: 10

  floci:
    image: floci/floci:2.0.1@sha256:4e451c39c7bb88e3cd4f87e8fc0c25d5b47695a51185d521e2241fa00486e8eb
    environment:
      FLOCI_HOSTNAME: floci
      FLOCI_STORAGE_MODE: persistent
      FLOCI_STORAGE_PERSISTENT_PATH: /app/data
    ports:
      - "127.0.0.1:4566:4566"
    volumes:
      - floci-data:/app/data

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command:
      ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      DATABASE_URL: postgresql+psycopg://fewia:fewia@postgres:5432/fewia
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  floci-data:
