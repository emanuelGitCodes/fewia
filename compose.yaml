x-backend: &backend
  build:
    context: .
    dockerfile: backend/Dockerfile
  environment:
    DATABASE_URL: postgresql+psycopg://fewia:fewia@postgres:5432/fewia

services:
  postgres:
    image: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
    environment:
      POSTGRES_USER: fewia
      POSTGRES_PASSWORD: fewia
      POSTGRES_DB: fewia
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-55435}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fewia -d fewia"]
      interval: 5s
      timeout: 5s
      retries: 10

  floci:
    image: floci/floci:2.0.1@sha256:4e451c39c7bb88e3cd4f87e8fc0c25d5b47695a51185d521e2241fa00486e8eb
    environment:
      FLOCI_HOSTNAME: floci
      FLOCI_STORAGE_MODE: persistent
      FLOCI_STORAGE_PERSISTENT_PATH: /app/data
    ports:
      - "127.0.0.1:${FLOCI_HOST_PORT:-4567}:4566"
    volumes:
      - floci-data:/app/data

  bootstrap:
    <<: *backend
    command:
      [
        "python",
        "-m",
        "app.bootstrap_demo",
        "--endpoint",
        "http://floci:4566",
      ]
    depends_on:
      postgres:
        condition: service_healthy
      floci:
        condition: service_healthy
    restart: "no"

  api:
    <<: *backend
    command:
      ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8010}:8000"
    restart: unless-stopped
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/healthz', timeout=3)",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  worker:
    <<: *backend
    command:
      ["python", "-m", "app.worker", "--endpoint", "http://floci:4566"]
    stop_grace_period: 600s
    restart: unless-stopped
    depends_on:
      bootstrap:
        condition: service_completed_successfully

  sync-worker:
    <<: *backend
    command:
      [
        "python",
        "-m",
        "app.worker",
        "--kind",
        "sync",
        "--endpoint",
        "http://floci:4566",
      ]
    stop_grace_period: 600s
    restart: unless-stopped
    depends_on:
      bootstrap:
        condition: service_completed_successfully

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-5173}:8080"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  floci-data:
