# Default Kroger fixture mode: no Kroger credentials and no mounted files.
# Invented fixture stores, products, and prices replace Kroger. Live Kroger uses compose.kroger.yaml.
# The worker gets the variable so settings validation agrees on both services.
services:
  api:
    environment:
      FEWIA_KROGER_MODE: fixture
  worker:
    environment:
      FEWIA_KROGER_MODE: fixture
