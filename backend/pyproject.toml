[project]
name = "fewia-backend"
version = "0.1.0"
description = "FEWIA backend API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy>=2",
    "alembic",
    "pydantic>=2",
    "pydantic-settings",
    "psycopg[binary]",
    "boto3",
    "httpx",
    "cryptography",
]

[dependency-groups]
dev = [
    "pytest",
    "mypy",
    "ruff",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN", "BLE", "DTZ"]

[tool.mypy]
python_version = "3.12"
strict = true
