[project]
name = "fewia-backend"
version = "0.1.0"
description = "FEWIA backend API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy>=2",
    "alembic",
    "pydantic>=2",
    "pydantic-settings",
    "psycopg[binary]",
    "scikit-learn",
    "pandas",
    "numpy",
    "joblib",
    "boto3",
    "httpx",
]

[dependency-groups]
dev = [
    "pytest",
    "mypy",
    "ruff",
    "pandas-stubs",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["sklearn.*", "joblib.*"]
ignore_missing_imports = true
