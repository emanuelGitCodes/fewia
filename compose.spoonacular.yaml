services:
  api:
    environment:
      FEWIA_SPOONACULAR_KEY_FILE: /run/fewia/spoonacular-key
    volumes:
      - type: bind
        source: "${FEWIA_SPOONACULAR_CREDENTIALS_FILE:?Use the validated runtime launcher}"
        target: /run/fewia/spoonacular-key
        read_only: true
        bind:
          create_host_path: false
