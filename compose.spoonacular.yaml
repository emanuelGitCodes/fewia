x-spoonacular: &spoonacular
  environment:
    FEWIA_SPOONACULAR_KEY_FILE: /run/fewia/spoonacular-key
  volumes:
    - type: bind
      source: "${FEWIA_SPOONACULAR_KEY_FILE:?FEWIA_SPOONACULAR_KEY_FILE MUST be an absolute path}"
      target: /run/fewia/spoonacular-key
      read_only: true
      bind:
        create_host_path: false

services:
  api:
    <<: *spoonacular
