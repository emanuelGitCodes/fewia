services:
  api:
    environment:
      FEWIA_SPOONACULAR_KEY_FILE: /run/fewia/spoonacular-key
    volumes:
      - type: bind
        source: "${FEWIA_SPOONACULAR_KEY_FILE:?Set FEWIA_SPOONACULAR_KEY_FILE to an absolute host path outside the repository}"
        target: /run/fewia/spoonacular-key
        read_only: true
        bind:
          create_host_path: false
