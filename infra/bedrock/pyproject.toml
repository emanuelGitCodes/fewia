[project]
name = "fewia-bedrock-infra"
version = "0.1.0"
description = "Development IAM role for Bedrock Converse"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aws-cdk-lib>=2.170.0,<3",
    "constructs>=10.0.0,<11",
]

[dependency-groups]
dev = [
    "pytest",
    "mypy",
    "ruff",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["."]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
